<form class="space-y-10" onsubmit="event.preventDefault();">

<!-- Footer -->

<script>
        // Micro-interactions for Effort Slider
        const slider = document.getElementById('effort-slider');
        const effortVal = document.getElementById('effort-val');
        
        slider.addEventListener('input', (e) => {
            effortVal.innerText = e.target.value;
            // Visual feedback on the slider value
            const val = e.target.value;
            if (val > 8) {
                effortVal.className = "text-error font-bold text-title-md scale-110 transition-all duration-300";
            } else if (val < 4) {
                effortVal.className = "text-tertiary font-bold text-title-md transition-all";
            } else {
                effortVal.className = "text-primary font-bold text-title-md transition-all";
            }
        });

        // Simple button active state toggle for Activity Type
        const activityButtons = document.querySelectorAll('section .grid button');
        activityButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                activityButtons.forEach(b => {
                    b.classList.remove('border-2', 'border-primary-container', 'bg-surface-high');
                    b.classList.add('border', 'border-outline-variant', 'bg-surface-container');
                    const icon = b.querySelector('.material-symbols-outlined');
                    const text = b.querySelector('.text-label-caps');
                    icon.style.fontVariationSettings = "'FILL' 0";
                    icon.classList.remove('text-primary');
                    text.classList.remove('text-primary');
                });
                btn.classList.remove('border', 'border-outline-variant', 'bg-surface-container');
                btn.classList.add('border-2', 'border-primary-container', 'bg-surface-high');
                const activeIcon = btn.querySelector('.material-symbols-outlined');
                const activeText = btn.querySelector('.text-label-caps');
                activeIcon.style.fontVariationSettings = "'FILL' 1";
                activeIcon.classList.add('text-primary');
                activeText.classList.add('text-primary');
            });
        });
    </script>

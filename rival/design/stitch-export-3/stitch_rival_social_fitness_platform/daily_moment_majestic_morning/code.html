<style>
    body {
      background-color: #131313;
      color: #e5e2e1;
      overflow: hidden;
    }

    .reveal-animation {
      animation: fadeIn 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Updated overlay for better legibility on a light/sunrise background */
    .bg-overlay {
      background: linear-gradient(to bottom, rgba(19, 19, 19, 0.2) 0%, rgba(19, 19, 19, 0.6) 100%);
    }

    /* Text shadow to ensure legibility on high-key images */
    .text-legible {
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    }

    .cta-glass {
      background: rgba(19, 19, 19, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(217, 119, 87, 0.3);
      transition: all 0.3s ease;
    }

    .cta-glass:hover {
      background: rgba(217, 119, 87, 0.1);
      border-color: rgba(217, 119, 87, 0.6);
      transform: scale(1.02);
    }
    
    .cta-glass:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="h-screen w-full relative">
<!-- Immersive Background Layer -->
<div class="fixed inset-0 z-0">
<img alt="Majestic snow-capped mountain peak at sunrise" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDzigfSMzpfCmkcQSj-Bp7IazMY-aAAk7DD1yIYKBXdFyYFPP8TEzT9aOXYiibQPl4H_yoIa7xt5P_Qeu0WybW_aoCBmmaHcAMlsfzTfeBfXAMy8z6s_8i-SWio_VnQ7SxYihaOa7CVf20Z93YkgFUUtt0QnW66cNq6hl5GCeWbbs2znY1GwJGmZpQrN5CGfUaSA-CS9Xq2KPTKmLrbjqbJFBBT8ykUH3YvQN7orHFBdd57puXjiYR4unJ5Ob-74lRnX1Bu9qdapkWT"/>
<div class="absolute inset-0 bg-overlay"></div>
</div>
<!-- Content Canvas -->
<main class="relative z-10 h-full flex flex-col items-center justify-between py-12 px-container-padding">
<!-- Top Bar Navigation -->
<header class="flex justify-center items-center w-full">
<div class="text-title-md font-title-md font-bold tracking-[0.2em] text-white text-legible">
        RIVAL
      </div>
</header>
<!-- Center Piece: Quote -->
<div class="flex flex-col items-center text-center max-w-2xl reveal-animation" style="animation-delay: 0.5s;">
<h1 class="font-display-hero text-display-hero text-white mb-8 md:text-5xl text-3xl leading-tight text-legible">
        The summit is just a point. The path is where the wisdom lies.
      </h1>
<!-- Subtle Decorative Element -->
<div class="w-12 h-[1px] bg-rank-pro shadow-[0_0_8px_rgba(217,119,87,0.8)]"></div>
</div>
<!-- Bottom Action -->
<div class="reveal-animation" style="animation-delay: 1.2s;">
<button class="cta-glass px-10 py-4 rounded-lg flex items-center gap-3 group">
<span class="font-label-caps text-label-caps text-white tracking-widest uppercase">
          Enter the Collective
        </span>
<span class="material-symbols-outlined text-rank-pro group-hover:translate-x-1 transition-transform" style="font-size: 18px;">
          arrow_forward
        </span>
</button>
</div>
</main>
<!-- Lightweight Interaction Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // Perspective tilt effect for background image
      document.addEventListener('mousemove', (e) => {
        const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
        const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
        const bg = document.querySelector('img');
        if(bg) {
          bg.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
        }
      });
    });
  </script>
